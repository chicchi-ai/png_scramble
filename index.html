<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PNG Multi-Region Scrambler</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.8);
      border-radius: 4px;
    }
    
    /* Checkerboard background for transparent PNG preview */
    .checkerboard {
      background-color: #0f172a;
      background-image: 
        linear-gradient(45deg, #1e293b 25%, transparent 25%), 
        linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #1e293b 75%), 
        linear-gradient(-45deg, transparent 75%, #1e293b 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }

    /* Touch Action Control for Canvas */
    .touch-canvas {
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans antialiased select-none overflow-hidden bg-slate-950">

  <!-- Top Navigation / Header -->
  <header class="h-14 bg-slate-900 border-b border-slate-800 px-3 sm:px-4 flex items-center justify-between shrink-0 z-20 shadow-md">
    <div class="flex items-center space-x-2 sm:space-x-3">
      <div class="p-1.5 sm:p-2 bg-indigo-600 rounded-lg text-white shadow-md shadow-indigo-500/20">
        <i class="fa-solid fa-shield-halved text-base sm:text-lg"></i>
      </div>
      <div>
        <h1 class="text-xs sm:text-sm font-bold tracking-wide text-white flex items-center gap-1.5">
          PNG Scrambler
          <span class="text-[10px] font-normal px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 hidden sm:inline-block">Metadata</span>
        </h1>
        <p class="text-[10px] text-slate-400 hidden sm:block">4x4 & 2x2 Pixel Swap with PNG Header Metadata</p>
      </div>
    </div>

    <!-- Header Actions -->
    <div class="flex items-center space-x-1.5 sm:space-x-2">
      <label for="fileInput" class="cursor-pointer px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-100 text-xs font-medium rounded-lg transition duration-150 flex items-center space-x-1.5 border border-slate-700 active:scale-95">
        <i class="fa-solid fa-folder-open text-indigo-400"></i>
        <span class="text-[11px] sm:text-xs">開く</span>
      </label>
      <input type="file" id="fileInput" accept="image/png" class="hidden">

      <button id="downloadBtn" disabled class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white text-xs font-medium rounded-lg transition duration-150 flex items-center space-x-1.5 shadow-lg shadow-emerald-900/20 border border-emerald-500/30 disabled:cursor-not-allowed active:scale-95">
        <i class="fa-solid fa-download text-xs"></i>
        <span class="text-[11px] sm:text-xs font-semibold">保存</span>
      </button>
    </div>
  </header>

  <!-- Main Content Layout (Flex Column on Mobile, Row on Desktop) -->
  <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
    
    <!-- Canvas Viewport Area -->
    <main class="flex-1 flex flex-col bg-slate-950 relative overflow-hidden min-h-0">
      
      <!-- Status Message Banner -->
      <div id="statusBanner" class="bg-indigo-950/70 border-b border-indigo-800/40 px-3 py-1.5 text-[11px] sm:text-xs flex items-center justify-between text-indigo-200 shrink-0">
        <div class="flex items-center space-x-1.5 truncate mr-2">
          <i class="fa-solid fa-circle-info text-indigo-400 text-xs shrink-0"></i>
          <span id="statusMessage" class="truncate">PNG画像を読み込んでください。</span>
        </div>
        <span id="canvasDimensions" class="font-mono text-slate-400 text-[10px] sm:text-[11px] shrink-0">- x -</span>
      </div>

      <!-- Scrollable Canvas Container -->
      <div class="flex-1 overflow-auto p-3 sm:p-6 flex items-center justify-center checkerboard relative" id="canvasViewport">
        
        <!-- Empty Upload Placeholder -->
        <div id="emptyState" class="text-center p-6 sm:p-8 max-w-xs sm:max-w-sm rounded-xl border border-dashed border-slate-700 bg-slate-900/90 backdrop-blur-sm shadow-xl">
          <div class="w-12 h-12 sm:w-16 sm:h-16 mx-auto mb-3 sm:mb-4 rounded-full bg-slate-800 flex items-center justify-center text-indigo-400 text-xl sm:text-2xl shadow-inner border border-slate-700">
            <i class="fa-solid fa-cloud-arrow-up"></i>
          </div>
          <h3 class="text-xs sm:text-sm font-semibold text-slate-200 mb-1">PNG画像を選択</h3>
          <p class="text-[11px] sm:text-xs text-slate-400 mb-4">ドラッグ/タッチ操作で範囲を指定して暗号化・復元できます。</p>
          <button onclick="document.getElementById('fileInput').click()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium rounded-lg transition shadow-md active:scale-95">
            画像ファイルを選択
          </button>
        </div>

        <!-- Canvas and Overlay Container -->
        <div id="canvasContainer" class="relative hidden shadow-2xl rounded-sm border border-slate-700/60 overflow-hidden inline-block touch-canvas">
          <!-- Pure Image Canvas -->
          <canvas id="mainCanvas" class="block cursor-crosshair relative z-0"></canvas>
          
          <!-- Visual Overlay Layer (Separated from Canvas Context) -->
          <div id="selectionOverlay" class="absolute border-2 border-indigo-400 bg-indigo-500/20 pointer-events-none hidden z-10"></div>
          <div id="regionOverlaysContainer" class="absolute inset-0 pointer-events-none z-10"></div>
        </div>
      </div>

      <!-- Mobile Quick Toolbar (Sticky at Bottom of Canvas Area) -->
      <div class="p-2 bg-slate-900/90 border-t border-slate-800 flex items-center justify-between text-xs shrink-0 backdrop-blur-md">
        <div class="flex items-center space-x-1.5 text-slate-300 truncate">
          <span class="text-[10px] sm:text-xs text-slate-400 font-mono" id="currentSelectionCoords">未選択</span>
        </div>

        <div class="flex items-center space-x-1.5">
          <button id="toggleOverlaysBtn" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-indigo-400 rounded border border-slate-700 flex items-center gap-1 text-[11px]">
            <i class="fa-solid fa-eye"></i>
            <span class="hidden sm:inline">枠表示</span>
          </button>
          
          <button id="processBtn" disabled class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-30 text-white text-xs font-medium rounded-md transition flex items-center gap-1 shadow active:scale-95 disabled:cursor-not-allowed">
            <i class="fa-solid fa-shuffle text-xs"></i>
            <span>加工実行</span>
          </button>
        </div>
      </div>
    </main>

    <!-- Control Sidebar / Drawer for Mobile & Desktop -->
    <aside class="w-full md:w-80 bg-slate-900 border-t md:border-t-0 md:border-l border-slate-800 flex flex-col shrink-0 z-10 shadow-xl max-h-48 md:max-h-none overflow-hidden">
      
      <!-- Panel Header -->
      <div class="p-2.5 sm:p-3 border-b border-slate-800 flex items-center justify-between bg-slate-800/60 shrink-0">
        <h2 class="text-xs font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-layer-group text-indigo-400"></i>
          加工領域 (<span id="regionCount">0</span>)
        </h2>
        
        <div class="flex items-center space-x-2">
          <button id="undoBtn" disabled class="px-2 py-1 bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-slate-200 text-[11px] font-medium rounded border border-slate-700 flex items-center gap-1 active:scale-95 disabled:cursor-not-allowed">
            <i class="fa-solid fa-rotate-left"></i>
            <span>戻す</span>
          </button>
          <button id="clearAllBtn" disabled class="px-2 py-1 bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-rose-400 text-[11px] font-medium rounded border border-slate-700 flex items-center gap-1 active:scale-95 disabled:cursor-not-allowed">
            <i class="fa-solid fa-trash-can"></i>
            <span>全削除</span>
          </button>
        </div>
      </div>

      <!-- Processed Regions List -->
      <div class="flex-1 overflow-y-auto p-2 sm:p-3 space-y-1.5 sm:space-y-2" id="regionListContainer">
        <div id="regionListEmpty" class="h-full flex flex-col items-center justify-center text-center p-3 text-slate-500">
          <i class="fa-solid fa-vector-square text-lg sm:text-xl mb-1 text-slate-600"></i>
          <p class="text-[11px]">加工された領域リストがここに表示されます。</p>
        </div>
      </div>

      <!-- Footer Info -->
      <div class="hidden md:block p-3 bg-slate-950 border-t border-slate-800 text-[11px] text-slate-400 space-y-1">
        <div class="font-bold text-slate-300 flex items-center gap-1">
          <i class="fa-solid fa-microchip text-indigo-400"></i> 加工アルゴリズム
        </div>
        <p class="leading-relaxed text-slate-400 text-[10.5px]">
          4x4ブロック内並び替え ＋ 4x4ブロックの2x2並び替え（8x8px単位）
        </p>
      </div>
    </aside>

  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const downloadBtn = document.getElementById('downloadBtn');
    const mainCanvas = document.getElementById('mainCanvas');
    const ctx = mainCanvas.getContext('2d', { willReadFrequently: true });
    const canvasContainer = document.getElementById('canvasContainer');
    const selectionOverlay = document.getElementById('selectionOverlay');
    const regionOverlaysContainer = document.getElementById('regionOverlaysContainer');
    
    const statusMessage = document.getElementById('statusMessage');
    const canvasDimensions = document.getElementById('canvasDimensions');
    const currentSelectionCoords = document.getElementById('currentSelectionCoords');
    const regionCount = document.getElementById('regionCount');
    
    const processBtn = document.getElementById('processBtn');
    const undoBtn = document.getElementById('undoBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const toggleOverlaysBtn = document.getElementById('toggleOverlaysBtn');
    const regionListContainer = document.getElementById('regionListContainer');
    const regionListEmpty = document.getElementById('regionListEmpty');

    let currentArrayBuffer = null;
    let isSelecting = false;
    let startX = 0, startY = 0;
    let selectionRect = null;
    let processedRegions = [];
    let showOverlays = true;

    // CRC32 Lookup Table
    const crcTable = [];
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) {
        c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
      }
      crcTable[n] = c;
    }

    function calculateCRC(buf) {
      let crc = 0xffffffff;
      for (let i = 0; i < buf.length; i++) {
        crc = (crc >>> 8) ^ crcTable[(crc ^ buf[i]) & 0xff];
      }
      return (crc ^ 0xffffffff) >>> 0;
    }

    // Read PNG Header Metadata (CropRegions key)
    function readPNGMetadata(buffer) {
      const view = new DataView(buffer);
      if (buffer.byteLength < 8 || view.getUint32(0) !== 0x89504e47 || view.getUint32(4) !== 0x0d0a1a0a) {
        return [];
      }

      let offset = 8;
      const regions = [];

      while (offset < buffer.byteLength) {
        const length = view.getUint32(offset);
        const type = String.fromCharCode(
          view.getUint8(offset + 4),
          view.getUint8(offset + 5),
          view.getUint8(offset + 6),
          view.getUint8(offset + 7)
        );

        if (type === 'tEXt') {
          const chunkData = new Uint8Array(buffer, offset + 8, length);
          let nullIndex = -1;
          for (let i = 0; i < chunkData.length; i++) {
            if (chunkData[i] === 0) {
              nullIndex = i;
              break;
            }
          }
          if (nullIndex !== -1) {
            const keyword = new TextDecoder().decode(chunkData.subarray(0, nullIndex));
            if (keyword === 'CropRegions' || keyword === 'CropRegion') {
              const text = new TextDecoder().decode(chunkData.subarray(nullIndex + 1));
              if (text.trim().length > 0) {
                const parts = text.split(';');
                for (const part of parts) {
                  const [x, y, w, h] = part.split(',').map(Number);
                  if (!isNaN(x) && !isNaN(y) && !isNaN(w) && !isNaN(h)) {
                    regions.push({ x, y, w, h });
                  }
                }
              }
            }
          }
        }
        offset += 12 + length;
      }
      return regions;
    }

    // Inject tEXt chunk with key CropRegions
    function injecttEXtChunk(pngBuffer, keyword, text) {
      const encoder = new TextEncoder();
      const keyBytes = encoder.encode(keyword);
      const textBytes = encoder.encode(text);

      const dataLength = keyBytes.length + 1 + textBytes.length;
      const chunk = new Uint8Array(12 + dataLength);
      const view = new DataView(chunk.buffer);

      view.setUint32(0, dataLength);
      chunk[4] = 0x74; // 't'
      chunk[5] = 0x45; // 'E'
      chunk[6] = 0x58; // 'X'
      chunk[7] = 0x74; // 't'

      chunk.set(keyBytes, 8);
      chunk[8 + keyBytes.length] = 0;
      chunk.set(textBytes, 8 + keyBytes.length + 1);

      const crcVal = calculateCRC(chunk.subarray(4, 8 + dataLength));
      view.setUint32(8 + dataLength, crcVal);

      const origView = new DataView(pngBuffer);
      const ihdrLen = origView.getUint32(8);
      const insertPos = 8 + 12 + ihdrLen;

      const result = new Uint8Array(pngBuffer.byteLength + chunk.length);
      result.set(new Uint8Array(pngBuffer, 0, insertPos), 0);
      result.set(chunk, insertPos);
      result.set(new Uint8Array(pngBuffer, insertPos), insertPos + chunk.length);

      return result.buffer;
    }

    // Core Pixel Transform Engine
    function transformRegion(rx, ry, rw, rh) {
      const imgData = ctx.getImageData(rx, ry, rw, rh);
      const data = imgData.data;

      const temp4x4 = new Uint8ClampedArray(rw * rh * 4);
      const dstData = new Uint8ClampedArray(rw * rh * 4);

      const map4x4 = [
        [2,2], [2,3], [2,0], [2,1],
        [3,2], [3,3], [3,0], [3,1],
        [0,2], [0,3], [0,0], [0,1],
        [1,2], [1,3], [1,0], [1,1]
      ];

      // Step 1: Swap 4x4 pixels within each 4x4 block
      for (let by = 0; by < rh; by += 4) {
        for (let bx = 0; bx < rw; bx += 4) {
          for (let i = 0; i < 16; i++) {
            const srcRow = Math.floor(i / 4);
            const srcCol = i % 4;
            const [dstRow, dstCol] = map4x4[i];

            const srcPx = (by + srcRow) * rw + (bx + srcCol);
            const dstPx = (by + dstRow) * rw + (bx + dstCol);

            for (let c = 0; c < 4; c++) {
              temp4x4[dstPx * 4 + c] = data[srcPx * 4 + c];
            }
          }
        }
      }

      const mapBlock = [
        [1, 1], [1, 0],
        [0, 1], [0, 0]
      ];

      // Step 2: Swap 4x4 blocks in 2x2 matrix
      for (let bby = 0; bby < rh; bby += 8) {
        for (let bbx = 0; bbx < rw; bbx += 8) {
          for (let bi = 0; bi < 4; bi++) {
            const srcBlockRow = Math.floor(bi / 2);
            const srcBlockCol = bi % 2;
            const [dstBlockRow, dstBlockCol] = mapBlock[bi];

            for (let py = 0; py < 4; py++) {
              for (let px = 0; px < 4; px++) {
                const sX = bbx + srcBlockCol * 4 + px;
                const sY = bby + srcBlockRow * 4 + py;
                const dX = bbx + dstBlockCol * 4 + px;
                const dY = bby + dstBlockRow * 4 + py;

                const sPx = sY * rw + sX;
                const dPx = dY * rw + dX;

                for (let c = 0; c < 4; c++) {
                  dstData[dPx * 4 + c] = temp4x4[sPx * 4 + c];
                }
              }
            }
          }
        }
      }

      imgData.data.set(dstData);
      ctx.putImageData(imgData, rx, ry);
    }

    // Handle File Input
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        currentArrayBuffer = evt.target.result;
        const restoredRegions = readPNGMetadata(currentArrayBuffer);

        const img = new Image();
        img.onload = () => {
          mainCanvas.width = img.width;
          mainCanvas.height = img.height;
          ctx.drawImage(img, 0, 0);

          processedRegions = [];
          selectionRect = null;
          selectionOverlay.classList.add('hidden');
          
          canvasDimensions.textContent = `${img.width}x${img.height}px`;
          emptyState.classList.add('hidden');
          canvasContainer.classList.remove('hidden');
          downloadBtn.disabled = false;

          if (restoredRegions.length > 0) {
            restoredRegions.forEach(reg => {
              const prevData = ctx.getImageData(reg.x, reg.y, reg.w, reg.h);
              transformRegion(reg.x, reg.y, reg.w, reg.h);
              
              processedRegions.push({
                id: Date.now() + Math.random(),
                x: reg.x,
                y: reg.y,
                w: reg.w,
                h: reg.h,
                snapshot: prevData
              });
            });

            statusMessage.textContent = `${restoredRegions.length}件のメタデータ領域を検出して自動復元しました。`;
          } else {
            statusMessage.textContent = '画像を読み込みました。ドラッグで範囲を選択できます。';
          }

          updateUI();
        };
        img.src = URL.createObjectURL(file);
      };
      reader.readAsArrayBuffer(file);
    });

    // Helper to get Canvas Relative Coordinates for Mouse and Touch
    function getCanvasCoordinates(e) {
      const rect = mainCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function handleStart(e) {
      if (!currentArrayBuffer) return;
      const coords = getCanvasCoordinates(e);
      startX = coords.x;
      startY = coords.y;
      isSelecting = true;

      selectionOverlay.style.left = `${startX}px`;
      selectionOverlay.style.top = `${startY}px`;
      selectionOverlay.style.width = '0px';
      selectionOverlay.style.height = '0px';
      selectionOverlay.classList.remove('hidden');
    }

    function handleMove(e) {
      if (!isSelecting) return;
      if (e.touches) e.preventDefault(); // Prevent page scroll during touch selection

      const coords = getCanvasCoordinates(e);
      const currentX = coords.x;
      const currentY = coords.y;

      const x = Math.min(startX, currentX);
      const y = Math.min(startY, currentY);
      const w = Math.abs(currentX - startX);
      const h = Math.abs(currentY - startY);

      selectionOverlay.style.left = `${x}px`;
      selectionOverlay.style.top = `${y}px`;
      selectionOverlay.style.width = `${w}px`;
      selectionOverlay.style.height = `${h}px`;
    }

    function handleEnd() {
      if (!isSelecting) return;
      isSelecting = false;

      const overlayRect = {
        x: parseFloat(selectionOverlay.style.left),
        y: parseFloat(selectionOverlay.style.top),
        w: parseFloat(selectionOverlay.style.width),
        h: parseFloat(selectionOverlay.style.height)
      };

      let x = Math.floor(overlayRect.x);
      let y = Math.floor(overlayRect.y);
      let w = Math.floor(overlayRect.w);
      let h = Math.floor(overlayRect.h);

      // Round to 8px multiples
      w = Math.floor(w / 8) * 8;
      h = Math.floor(h / 8) * 8;

      if (x + w > mainCanvas.width) w = Math.floor((mainCanvas.width - x) / 8) * 8;
      if (y + h > mainCanvas.height) h = Math.floor((mainCanvas.height - y) / 8) * 8;

      if (w > 0 && h > 0) {
        selectionRect = { x, y, w, h };
        currentSelectionCoords.textContent = `(${x}, ${y}) ${w}x${h}px`;
        processBtn.disabled = false;

        selectionOverlay.style.left = `${x}px`;
        selectionOverlay.style.top = `${y}px`;
        selectionOverlay.style.width = `${w}px`;
        selectionOverlay.style.height = `${h}px`;
      } else {
        selectionOverlay.classList.add('hidden');
        selectionRect = null;
        currentSelectionCoords.textContent = '未選択';
        processBtn.disabled = true;
      }
    }

    // Attach Mouse Events
    mainCanvas.addEventListener('mousedown', handleStart);
    mainCanvas.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    // Attach Touch Events (Mobile/Tablet)
    mainCanvas.addEventListener('touchstart', handleStart, { passive: false });
    mainCanvas.addEventListener('touchmove', handleMove, { passive: false });
    window.addEventListener('touchend', handleEnd);

    // Process Selected Region
    processBtn.addEventListener('click', () => {
      if (!selectionRect) return;

      const { x, y, w, h } = selectionRect;
      const prevSnapshot = ctx.getImageData(x, y, w, h);

      transformRegion(x, y, w, h);

      processedRegions.push({
        id: Date.now() + Math.random(),
        x, y, w, h,
        snapshot: prevSnapshot
      });

      selectionOverlay.classList.add('hidden');
      selectionRect = null;
      currentSelectionCoords.textContent = '未選択';
      processBtn.disabled = true;

      statusMessage.textContent = `領域 (${x}, ${y}, ${w}, ${h}) を加工処理しました。`;
      updateUI();
    });

    // Undo Last Action
    undoBtn.addEventListener('click', () => {
      if (processedRegions.length === 0) return;
      const lastReg = processedRegions.pop();
      ctx.putImageData(lastReg.snapshot, lastReg.x, lastReg.y);

      statusMessage.textContent = `領域 (${lastReg.x}, ${lastReg.y}) の加工を取り消しました。`;
      updateUI();
    });

    // Clear All Regions
    clearAllBtn.addEventListener('click', () => {
      if (processedRegions.length === 0) return;
      for (let i = processedRegions.length - 1; i >= 0; i--) {
        const reg = processedRegions[i];
        ctx.putImageData(reg.snapshot, reg.x, reg.y);
      }
      processedRegions = [];
      statusMessage.textContent = 'すべての加工を解除しました。';
      updateUI();
    });

    // Toggle Visual Selection Frames
    toggleOverlaysBtn.addEventListener('click', () => {
      showOverlays = !showOverlays;
      regionOverlaysContainer.style.display = showOverlays ? 'block' : 'none';
      toggleOverlaysBtn.classList.toggle('text-indigo-400', showOverlays);
      toggleOverlaysBtn.classList.toggle('text-slate-400', !showOverlays);
    });

    // Save PNG with Metadata
    downloadBtn.addEventListener('click', () => {
      mainCanvas.toBlob((blob) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const buffer = e.target.result;

          const metaText = processedRegions.map(r => `${r.x},${r.y},${r.w},${r.h}`).join(';');
          const newBuffer = injecttEXtChunk(buffer, 'CropRegions', metaText);

          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([newBuffer], { type: 'image/png' }));
          a.download = `scrambled_${Date.now()}.png`;
          a.click();

          statusMessage.textContent = `PNG画像（埋め込み情報: ${processedRegions.length}件）を保存しました。`;
        };
        reader.readAsArrayBuffer(blob);
      }, 'image/png');
    });

    // Synchronize UI State and Region List
    function updateUI() {
      regionCount.textContent = processedRegions.length;
      undoBtn.disabled = processedRegions.length === 0;
      clearAllBtn.disabled = processedRegions.length === 0;

      regionListContainer.innerHTML = '';
      regionOverlaysContainer.innerHTML = '';

      if (processedRegions.length === 0) {
        regionListContainer.appendChild(regionListEmpty);
        return;
      }

      processedRegions.forEach((reg, index) => {
        const item = document.createElement('div');
        item.className = 'p-2 bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 rounded-lg text-xs flex items-center justify-between transition';
        item.innerHTML = `
          <div class="flex items-center space-x-2">
            <span class="w-4 h-4 rounded bg-indigo-600/30 text-indigo-300 border border-indigo-500/40 font-mono text-[9px] flex items-center justify-center font-bold shrink-0">
              ${index + 1}
            </span>
            <div class="truncate">
              <div class="font-mono text-slate-200 font-semibold text-[11px]">(${reg.x}, ${reg.y})</div>
              <div class="text-[9.5px] text-slate-400 font-mono">${reg.w} x ${reg.h} px</div>
            </div>
          </div>
          <button title="削除" onclick="removeSingleRegion(${index})" class="p-1 text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 rounded transition">
            <i class="fa-solid fa-xmark text-xs"></i>
          </button>
        `;

        item.addEventListener('mouseenter', () => {
          const ov = document.getElementById(`overlay-${reg.id}`);
          if (ov) ov.classList.add('border-amber-400', 'bg-amber-400/20');
        });
        item.addEventListener('mouseleave', () => {
          const ov = document.getElementById(`overlay-${reg.id}`);
          if (ov) ov.classList.remove('border-amber-400', 'bg-amber-400/20');
        });

        regionListContainer.appendChild(item);

        const overlay = document.createElement('div');
        overlay.id = `overlay-${reg.id}`;
        overlay.className = 'absolute border border-indigo-400/70 bg-indigo-500/10 transition-colors pointer-events-none';
        overlay.style.left = `${reg.x}px`;
        overlay.style.top = `${reg.y}px`;
        overlay.style.width = `${reg.w}px`;
        overlay.style.height = `${reg.h}px`;
        regionOverlaysContainer.appendChild(overlay);
      });
    }

    // Delete Single Processed Region
    window.removeSingleRegion = function(index) {
      if (index < 0 || index >= processedRegions.length) return;

      const target = processedRegions[index];
      ctx.putImageData(target.snapshot, target.x, target.y);

      const remaining = processedRegions.slice(index + 1);
      processedRegions = processedRegions.slice(0, index);

      remaining.forEach(reg => {
        const prevSnap = ctx.getImageData(reg.x, reg.y, reg.w, reg.h);
        transformRegion(reg.x, reg.y, reg.w, reg.h);
        processedRegions.push({
          ...reg,
          snapshot: prevSnap
        });
      });

      statusMessage.textContent = `領域 #${index + 1} を削除しました。`;
      updateUI();
    };
  </script>
</body>
</html>
